name: Post queued reviews

# Cloud review rounds can't write to ballerina-nutcracker/ballerina, so they send each review, issue and comment
# here as a repository_dispatch (round_state.py send); this posts it as the reviewer with REVIEW_POST_TOKEN.
# Nothing is committed: the run log is the record, and a failed run emails the repo owner.
on:
  repository_dispatch:
    types: [post-item]

# One group per item: a group keeps only one pending run and cancels the older one, so a single shared group dropped
# items a round sent in quick succession. Different items now post in parallel; a resend of the same item waits for
# the running one, and only its newest pending copy is kept.
concurrency:
  group: post-outbox-${{ github.event.client_payload.name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Unpack the item
        run: |
          python3 - <<'EOF'
          import base64, gzip, json, os, re, sys
          p = json.load(open(os.environ["GITHUB_EVENT_PATH"]))["client_payload"]
          name = p.get("name", "")
          if not re.fullmatch(r"(review|issue|issue-comment|ping)-[A-Za-z0-9_.-]+\.json", name):
              sys.exit(f"refusing item name {name!r}")
          blob = "".join(p[f"p{i}"] for i in range(int(p["parts"])))
          os.makedirs("outbox", exist_ok=True)
          open(os.path.join("outbox", name), "wb").write(gzip.decompress(base64.b64decode(blob)))
          print(f"unpacked {name} from round {p.get('started', '?')}")
          EOF

      - name: Post it
        env:
          GH_TOKEN: ${{ secrets.REVIEW_POST_TOKEN }}
          REVIEWER: warunalakshitha
        run: python3 skills/pre-pr-review/scripts/post_outbox.py
